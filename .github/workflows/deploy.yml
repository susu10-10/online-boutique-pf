name: Deploy Boutique Container

on:
  workflow_run:
    workflows: [ "Build and Push Boutique Containers" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

env:
  DOCR: registry.digitalocean.com/idpreg

jobs:  
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit