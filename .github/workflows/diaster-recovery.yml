name: DR Failover

on:
  workflow_dispatch:

env:
  TF_VERSION: 1.14.6

jobs:
  provision-dr-droplet:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    outputs:
      dr_ip: ${{ steps.get-ip.outputs.dr_ip }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}

      - name: Terraform Apply (DR)
        run: terraform apply -auto-approve -var="region=sfo3" -var="droplet_name=boutique-dr"
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_do_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
          TF_VAR_do_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_ssh_fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          TF_VAR_ts_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID}}
          TF_VAR_ts_client_secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

      - name: Get DR Droplet Tailscale Hostname
        id: get-ip
        run: |
          NAME=$(terraform output -raw droplet_name)
          echo "dr_ip=$NAME.tail107809.ts.net" >> $GITHUB_OUTPUT

  deploy-dr-droplet:
    needs: provision-dr-droplet
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      droplet_ip: ${{ needs.provision-dr-droplet.outputs.dr_ip }}
    secrets: inherit

